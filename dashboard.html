<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV Monitor</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    padding: 16px;
}

h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    color: #58a6ff;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.controls label {
    font-size: 0.85rem;
    color: #8b949e;
}

.controls select, .controls input {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    padding: 6px 10px;
    font-size: 0.85rem;
}

.controls select:focus, .controls input:focus {
    outline: none;
    border-color: #58a6ff;
}

.custom-range {
    display: none;
    gap: 8px;
    align-items: center;
}

.custom-range.visible {
    display: flex;
}

.graph-section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
}

.graph-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
    color: #58a6ff;
}

#graph {
    width: 100%;
    height: 400px;
}

.quad {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
}

.card-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
}

.card-title .icon { margin-right: 6px; }

.solar .card-title { color: #f0883e; }
.grid .card-title { color: #3fb950; }
.load .card-title { color: #d29922; }
.battery .card-title { color: #a371f7; }

.readings {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 0;
}

.row-label {
    font-size: 0.8rem;
    color: #8b949e;
    flex-shrink: 0;
    margin-right: 12px;
}

.row-value {
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
}

.row-value.w { color: #f0883e; }
.row-value.v { color: #79c0ff; }
.row-value.a { color: #ffa657; }
.row-value.watts { color: #d2a8ff; }
.row-value.freq { color: #7ee787; }
.row-value.pct { color: #a371f7; }
.row-value.temp { color: #79c0ff; }
.row-value.na { color: #484f58; }

.graph-section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
}

.graph-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
    color: #58a6ff;
}

#graph {
    width: 100%;
    height: 400px;
}

.status-bar {
    text-align: center;
    font-size: 0.7rem;
    color: #484f58;
    margin-top: 8px;
}

.status-bar .error { color: #f85149; }

/* Large values */
.big {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    margin: 4px 0;
}

/* Mobile */
@media (max-width: 600px) {
    body { padding: 8px; }
    .quad { gap: 8px; height: calc(100vh - 400px); }
    .card { padding: 12px; border-radius: 8px; }
    .card-title { font-size: 0.75rem; }
    .row-label { font-size: 0.7rem; margin-right: 8px; }
    .row-value { font-size: 0.95rem; }
    .big { font-size: 1.5rem; }
    h1 { font-size: 1.1rem; }
    .graph-section { display: none; }
    #graph { height: 300px; }
}

@media (max-height: 500px) and (orientation: landscape) {
    body { padding: 4px; }
    .quad { gap: 6px; height: calc(100vh - 40px); }
    .card { padding: 8px; }
    .card-title { font-size: 0.7rem; margin-bottom: 6px; }
    .row-label { font-size: 0.65rem; }
    .row-value { font-size: 0.85rem; }
    .big { font-size: 1.3rem; }
}
</style>
</head>
<body>
<h1>Photovoltaic Monitor</h1>
<div class="controls">
    <label>Time range:</label>
    <select id="rangeSelect">
        <option value="1d">Last 24 hours</option>
        <option value="1w">Last 7 days</option>
        <option value="1m" selected>Last 30 days</option>
        <option value="1y">Last year</option>
        <option value="custom">Custom range</option>
    </select>
    <div class="custom-range" id="customRange">
        <input type="datetime-local" id="startDateTime">
        <span>to</span>
        <input type="datetime-local" id="endDateTime">
    </div>
</div>
<div class="graph-section">
    <div class="graph-title">Performance History</div>
    <div id="graph"></div>
</div>
<div class="quad">
    <div class="card solar">
        <div class="card-title"><span class="icon">&#9729;</span>Solar PV</div>
        <div class="readings" id="solar"></div>
    </div>
    <div class="card grid">
        <div class="card-title"><span class="icon">&#9889;</span>Grid</div>
        <div class="readings" id="grid"></div>
    </div>
    <div class="card load">
        <div class="card-title"><span class="icon">&#128268;</span>Load</div>
        <div class="readings" id="load"></div>
    </div>
    <div class="card battery">
        <div class="card-title"><span class="icon">&#128267;</span>Battery</div>
        <div class="readings" id="battery"></div>
    </div>
</div>
<div class="status-bar" id="status">Connecting...</div>

<script>
const layouts = {
    solar: [
        { label: 'PV1 Power', key: 'PV1 Power', cls: 'w' },
        { label: 'PV2 Power', key: 'PV2 Power', cls: 'w' },
        { label: 'Total Power', key: '_total_pv', cls: 'w' },
        { label: 'PV1 Voltage', key: 'PV1 Voltage', cls: 'v' },
        { label: 'PV1 Current', key: 'PV1 Current', cls: 'a' },
        { label: 'PV2 Voltage', key: 'PV2 Voltage', cls: 'v' },
        { label: 'PV2 Current', key: 'PV2 Current', cls: 'a' },
    ],
    grid: [
        { label: 'Grid Power', key: 'Grid Power', cls: 'watts' },
        { label: 'CT Power', key: 'Grid CT Power', cls: 'watts' },
        { label: 'Grid Voltage', key: 'Grid Voltage', cls: 'v' },
        { label: 'Grid Current L', key: 'Grid Current L', cls: 'a' },
        { label: 'Grid Freq', key: 'Grid Frequency', cls: 'freq' },
    ],
    load: [
        { label: 'Load Total', key: 'Load Power Total', cls: 'watts' },
        { label: 'Load L1', key: 'Load Power L1', cls: 'watts' },
        { label: 'Load Voltage L1', key: 'Load Voltage L1', cls: 'v' },
        { label: 'Load Current L1', key: 'Load Current L1', cls: 'a' },
        { label: 'Load Freq', key: 'Load Frequency', cls: 'freq' },
    ],
    battery: [
        { label: 'Battery Power', key: 'Battery Power', cls: 'watts' },
        { label: 'SOC', key: 'Battery SOC', cls: 'pct' },
        { label: 'Battery Voltage', key: 'Battery Voltage', cls: 'v' },
        { label: 'Battery Current', key: 'Battery Current', cls: 'a' },
        { label: 'Battery Temp', key: 'Battery Temp', cls: 'temp' },
        { label: 'Charge Limit', key: 'Batt Charge Limit', cls: 'a' },
        { label: 'Discharge Limit', key: 'Batt Discharge Limit', cls: 'a' },
    ],
};

function fmt(val, unit) {
    if (val === null || val === undefined || val === 'N/A') return '<span class="row-value na">N/A</span>';
    if (unit === 'W') {
        const w = parseFloat(val);
        if (isNaN(w)) return '<span class="row-value na">N/A</span>';
        if (Math.abs(w) >= 1000) return '<span class="row-value ' + (layouts._tempCls || 'watts') + '">' + (w/1000).toFixed(2) + ' kW</span>';
        return '<span class="row-value ' + (layouts._tempCls || 'watts') + '">' + w.toFixed(0) + ' W</span>';
    }
    return '<span class="row-value ' + (layouts._tempCls || '') + '">' + parseFloat(val).toFixed(2) + ' ' + unit + '</span>';
}

function render(data) {
    for (const [zone, fields] of Object.entries(layouts)) {
        const el = document.getElementById(zone);
        let html = '';
        for (const f of fields) {
            let val = data[f.key];
            let unit = '';
            if (f.key === '_total_pv') {
                const p1 = parseFloat(data['PV1 Power'] || 0);
                const p2 = parseFloat(data['PV2 Power'] || 0);
                const total = p1 + p2;
                if (Math.abs(total) >= 1000) {
                    val = (total/1000).toFixed(2) + ' kW';
                } else {
                    val = total.toFixed(0) + ' W';
                }
                html += '<div class="row"><span class="row-label">' + f.label + '</span>' +
                    '<span class="row-value w" style="font-size:1.3rem">' + val + '</span></div>';
                continue;
            }
            if (f.key === 'Battery SOC') unit = '%';
            else if (f.key === 'Battery Temp') unit = '°C';
            else if (f.key === 'Grid Frequency' || f.key === 'Load Frequency') unit = 'Hz';
            else if (f.key === 'Inverter Freq') unit = 'Hz';
            else if (f.key === 'AUX Frequency') unit = 'Hz';
            else if (f.key === 'Grid Voltage' || f.key === 'PV1 Voltage' || f.key === 'PV2 Voltage' || f.key === 'Battery Voltage' || f.key === 'AUX Voltage' || f.key === 'Load Voltage L1') unit = 'V';
            else if (f.key === 'PV1 Current' || f.key === 'PV2 Current' || f.key === 'Grid Current L' || f.key === 'Grid Current N' || f.key === 'Battery Current' || f.key === 'Batt Charge Limit' || f.key === 'Batt Discharge Limit' || f.key === 'Load Current L1') unit = 'A';
            else if (f.key === 'PV1 Power' || f.key === 'PV2 Power' || f.key === 'Grid Power' || f.key === 'Grid CT Power' || f.key === 'Load Power Total' || f.key === 'Load Power L1' || f.key === 'Load Power L2' || f.key === 'Battery Power') unit = 'W';
            else unit = '';
            html += '<div class="row"><span class="row-label">' + f.label + '</span>' + fmt(val, unit) + '</div>';
        }
        el.innerHTML = html;
    }
}

function update() {
    fetch('/PV')
        .then(r => r.json())
        .then(data => {
            render(data);
            document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
            document.getElementById('status').className = 'status-bar';
        })
        .catch(e => {
            document.getElementById('status').innerHTML = '<span class="error">Error: ' + e.message + '</span>';
        });
}

update();
setInterval(update, 3000);

// ─── Graph ──────────────────────────────────────────────────────────────────

const graphMetrics = [
    { key: 'PV1 Power', label: 'PV1 Power', color: '#f0883e', unit: 'W', yaxis: 'y' },
    { key: 'PV2 Power', label: 'PV2 Power', color: '#f778ba', unit: 'W', yaxis: 'y' },
    { key: 'Grid Power', label: 'Grid Power', color: '#3fb950', unit: 'W', yaxis: 'y' },
    { key: 'Load Power Total', label: 'Load Power', color: '#d29922', unit: 'W', yaxis: 'y' },
    { key: 'Battery Power', label: 'Battery Power', color: '#a371f7', unit: 'W', yaxis: 'y' },
    { key: 'Battery SOC', label: 'Battery SOC', color: '#ffa657', unit: '%', yaxis: 'y2' },
];

let graphInitialized = false;
let graphData = [];
let graphLayout = {
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#161b22',
    font: { color: '#c9d1d9', family: 'Segoe UI, system-ui, sans-serif' },
    margin: { t: 20, r: 20, b: 50, l: 60 },
    xaxis: {
        type: 'date',
        gridcolor: '#21262d',
        zerolinecolor: '#21262d',
        tickfont: { size: 10 },
    },
    yaxis: {
        gridcolor: '#21262d',
        zerolinecolor: '#21262d',
        tickfont: { size: 10 },
        title: { text: 'Power (W)', font: { size: 12 } },
    },
    yaxis2: {
        gridcolor: '#21262d',
        zerolinecolor: '#21262d',
        tickfont: { size: 10 },
        title: { text: 'SOC (%)', font: { size: 12 } },
        side: 'right',
        overlaying: 'y',
        range: [0, 100],
    },
    hovermode: 'closest',
    showlegend: true,
    legend: {
        bgcolor: 'rgba(22,27,34,0.8)',
        bordercolor: '#30363d',
        borderwidth: 1,
        font: { size: 11 },
    },
};

const graphConfig = {
    scrollZoom: true,
    displayModeBar: false,
    responsive: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d'],
};

function initGraph() {
    graphData = graphMetrics.map(m => ({
        x: [],
        y: [],
        name: m.label,
        mode: 'lines',
        line: { width: 1.5, color: m.color },
        connectgaps: false,
        yaxis: m.yaxis,
    }));

    Plotly.newPlot('graph', graphData, graphLayout, graphConfig);

    const graphDiv = document.getElementById('graph');

    graphDiv.on('plotly_relayout', function(eventData) {
        if (!eventData || !eventData.source) return;
        // Only reset y-axis on zoom actions, not pan
        if (eventData.source === 'select' || eventData.source === 'zoom') {
            if (eventData['yaxis.range[0]'] !== undefined || eventData['yaxis.range[1]'] !== undefined) {
                Plotly.relayout(graphDiv, { 'yaxis.autorange': true, 'yaxis2.autorange': false });
            }
        }
    });

    graphDiv.on('plotly_click', function(eventData) {
        // Left click context menu
        if (eventData && eventData.event && eventData.event.button === 0) {
            showContextMenu(eventData.event.clientX, eventData.event.clientY);
        }
    });

    graphDiv.on('plotly_contextmenu', function(eventData) {
        // Right click context menu
        if (eventData && eventData.event) {
            showContextMenu(eventData.event.clientX, eventData.event.clientY);
        }
    });
}

function showContextMenu(x, y) {
    removeContextMenu();
    const menu = document.createElement('div');
    menu.id = 'graphContextMenu';
    menu.style.position = 'fixed';
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.style.background = '#161b22';
    menu.style.border = '1px solid #30363d';
    menu.style.borderRadius = '8px';
    menu.style.padding = '6px 0';
    menu.style.zIndex = '1000';
    menu.style.minWidth = '180px';
    menu.style.boxShadow = '0 8px 24px rgba(0,0,0,0.4)';

    const items = [
        { label: 'Reset zoom to fit all', action: 'resetZoom' },
        { label: 'Fit last 1 hour', action: 'fit1h' },
        { label: 'Fit last 6 hours', action: 'fit6h' },
        { label: 'Fit last 24 hours', action: 'fit24h' },
    ];

    items.forEach(item => {
        const btn = document.createElement('div');
        btn.style.padding = '8px 16px';
        btn.style.cursor = 'pointer';
        btn.style.fontSize = '13px';
        btn.style.color = '#c9d1d9';
        btn.style.textAlign = 'left';
        btn.textContent = item.label;
        btn.onmouseover = () => { btn.style.background = '#21262d'; };
        btn.onmouseout = () => { btn.style.background = 'transparent'; };
        btn.onclick = () => {
            handleContextMenuAction(item.action);
            removeContextMenu();
        };
        menu.appendChild(btn);
    });

    document.body.appendChild(menu);

    setTimeout(() => {
        document.addEventListener('click', function handler(e) {
            if (!menu.contains(e.target)) {
                removeContextMenu();
                document.removeEventListener('click', handler);
            }
        });
    }, 10);
}

function removeContextMenu() {
    const menu = document.getElementById('graphContextMenu');
    if (menu) menu.remove();
}

function handleContextMenuAction(action) {
    const graphDiv = document.getElementById('graph');
    if (!graphDiv || graphData.length === 0) return;

    let startTime, endTime;
    const now = new Date();

    switch (action) {
        case 'resetZoom':
            Plotly.relayout(graphDiv, { 'xaxis.autorange': true, 'yaxis.autorange': true, 'yaxis2.autorange': false });
            break;
        case 'fit1h':
            endTime = now.toISOString();
            startTime = new Date(now.getTime() - 3600000).toISOString();
            Plotly.relayout(graphDiv, {
                'xaxis.range': [startTime, endTime],
                'yaxis.autorange': true,
            });
            break;
        case 'fit6h':
            endTime = now.toISOString();
            startTime = new Date(now.getTime() - 21600000).toISOString();
            Plotly.relayout(graphDiv, {
                'xaxis.range': [startTime, endTime],
                'yaxis.autorange': true,
            });
            break;
        case 'fit24h':
            endTime = now.toISOString();
            startTime = new Date(now.getTime() - 86400000).toISOString();
            Plotly.relayout(graphDiv, {
                'xaxis.range': [startTime, endTime],
                'yaxis.autorange': true,
            });
            break;
    }
}

function loadGraphData() {
    const rangeSelect = document.getElementById('rangeSelect');
    const range = rangeSelect.value;
    let startTs, endTs;
    const now = Math.floor(Date.now() / 1000);

    if (range === 'custom') {
        const startInput = document.getElementById('startDateTime').value;
        const endInput = document.getElementById('endDateTime').value;
        if (!startInput || !endInput) return;
        startTs = Math.floor(new Date(startInput).getTime() / 1000);
        endTs = Math.floor(new Date(endInput).getTime() / 1000);
    } else {
        endTs = now;
        const hours = { '1d': 24, '1w': 168, '1m': 720, '1y': 8760 }[range];
        startTs = now - hours * 3600;
    }

    fetch('/api/readings?start=' + startTs + '&end=' + endTs)
        .then(r => r.json())
        .then(data => {
            if (!graphInitialized) {
                initGraph();
                graphInitialized = true;
            }

            const timestamps = data.map(d => d.timestamp * 1000);
            graphData.forEach((trace, idx) => {
                const metric = graphMetrics[idx];
                trace.x = timestamps;
                trace.y = data.map(d => d[metric.key] !== undefined ? d[metric.key] : null);
            });

            Plotly.react('graph', graphData, graphLayout, graphConfig);
        })
        .catch(e => {
            console.error('Failed to load graph data:', e);
        });
}

document.getElementById('rangeSelect').addEventListener('change', function() {
    const customRange = document.getElementById('customRange');
    if (this.value === 'custom') {
        customRange.classList.add('visible');
        const now = new Date();
        const oneDayAgo = new Date(now.getTime() - 86400000);
        const pad = (n) => String(n).padStart(2, '0');
        const toLocal = (d) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        document.getElementById('endDateTime').value = toLocal(now);
        document.getElementById('startDateTime').value = toLocal(oneDayAgo);
    } else {
        customRange.classList.remove('visible');
    }
    loadGraphData();
});

document.getElementById('startDateTime').addEventListener('change', loadGraphData);
document.getElementById('endDateTime').addEventListener('change', loadGraphData);

// Load graph on page load
setTimeout(loadGraphData, 1000);
</script>
</body>
</html>
